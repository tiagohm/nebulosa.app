name: Test

on:
    push:
        branches: [main]
        paths:
            - 'api/**'
            - 'app/**'
            - 'web/**'
            - 'bin/**'
            - 'core'
            - '.github/workflows/**'
            - 'package.json'
            - 'bun.lock'
            - 'tsconfig.json'
            - 'bunfig.toml'
            - '.oxlintrc.json'
            - '.oxfmtrc.json'
            - '.editorconfig'
    pull_request:
        paths:
            - 'api/**'
            - 'app/**'
            - 'web/**'
            - 'bin/**'
            - 'core'
            - '.github/workflows/**'
            - 'package.json'
            - 'bun.lock'
            - 'tsconfig.json'
            - 'bunfig.toml'
            - '.oxlintrc.json'
            - '.oxfmtrc.json'
            - '.editorconfig'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: true
                  persist-credentials: false
                  fetch-depth: ${{ matrix.os == 'ubuntu-24.04' && '50' || '1' }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: canary

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Generate Empty Sky Catalog
              run: bun make:catalog --empty

            - name: Generate Empty Moon Assets
              run: bun make:moon --empty

            - name: Format
              if: ${{ matrix.os == 'ubuntu-24.04' }}
              run: bun fmt --check

            - name: Lint
              if: ${{ matrix.os == 'ubuntu-24.04' }}
              run: bun lint

            - name: Test
              if: ${{ matrix.os == 'ubuntu-24.04' }}
              shell: bash
              env:
                  TEST_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
              # --changed maps changed modules to the tests that import them. A change no module import reaches (the core
              # submodule pointer, the lockfile, a manifest, the TypeScript, Bun, or lint configuration, a workflow) can change
              # how every test runs, so it runs them all.
              run: |
                  args=()
                  if [[ -n "$TEST_BASE_REF" ]] && git cat-file -e "${TEST_BASE_REF}^{commit}" 2>/dev/null; then
                      if git diff --name-only "$TEST_BASE_REF" HEAD | grep -qE '^(core|bun\.lock|bunfig\.toml|tsconfig\.json|\.oxlintrc\.json|\.github/workflows/.*)$|(^|/)(package|tsconfig)\.json$'; then
                          echo "A change outside the modules reaches every test; running them all."
                      else
                          args+=("--changed=$TEST_BASE_REF")
                      fi
                  fi
                  bun test --timeout 30000 --parallel --pass-with-no-tests "${args[@]}" --timings timings.json
